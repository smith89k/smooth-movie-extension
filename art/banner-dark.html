<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#EEF3FA;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(90,169,255,.15),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/26px 26px,
    #0D1117;}
.page{width:100%;height:100%;padding:44px 56px 40px;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#5AA9FF}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#919AA7;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#5AA9FF}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#161B22;border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.10);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8B94A3;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#8B94A3;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#D7DFEA}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#8B94A3;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#5AA9FF;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:rgba(63,185,80,.16);color:#4FC463;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:rgba(240,160,60,.16);color:#F0A83C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#919AA7}
.accent{color:#5AA9FF}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.player{width:880px;margin:0 auto}
.screen{position:relative;background:#0A1222;height:276px;display:flex;align-items:center;
  justify-content:center}
.play{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center}
.toast{position:absolute;background:rgba(10,18,34,.92);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;color:#DCE7FB;
  display:flex;align-items:center;gap:9px}
.track{height:10px;border-radius:5px;background:rgba(255,255,255,.16);position:relative;
  margin:0 20px 16px}
.buf{position:absolute;left:0;top:0;bottom:0;width:78%;border-radius:5px;background:rgba(90,169,255,.55)}
.pos{position:absolute;left:0;top:0;bottom:0;width:31%;border-radius:5px;background:#2EE08A}
.knob{position:absolute;left:31%;top:50%;width:20px;height:20px;border-radius:50%;
  background:#2EE08A;transform:translate(-50%,-50%)}

</style></head><body><div class="page">
<div class="row" style="gap:20px;flex:0 0 auto"><img class="logo" src="logo.svg" width="78" height="78" style="flex:0 0 auto;"><div><h1>Smooth Movie</h1><div class="sub">Watch online video with fewer ads, pop-ups and pauses</div></div></div><div class="mid"><div class="win player"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="pill grow">a-movie-site.example/watch</span><span class="grow"></span></div><div class="screen"><div class="play"><svg width="30" height="34" viewBox="0 0 30 34"><path d="M3 2 L28 17 L3 32 Z" fill="#0A1222"/></svg></div><div class="toast" style="left:20px;top:18px"><span class="dot" style="color:#FF5C5C"></span>14 ads blocked</div><div class="toast" style="right:20px;top:18px"><span class="dot" style="color:#FF5C5C"></span>3 pop-up tabs closed</div><div class="toast" style="right:20px;bottom:18px"><span class="dot" style="color:#2EE08A"></span>2 min loaded ahead</div></div><div style="background:#0A1222;padding-top:14px"><div class="track"><span class="buf"></span><span class="pos"></span><span class="knob"></span></div></div></div></div><div class="tag" style=";margin-top:0px;flex:0 0 auto">Fewer ads. <span class="a">No pop-up tabs.</span> Less buffering.</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:520px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#14171C;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(29,111,214,.10),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(0,0,0,.07) 1px,transparent 0) 0 0/26px 26px,
    #EFEEE9;}
.page{width:100%;height:100%;padding:44px 56px 40px;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#1D6FD6}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#5C636E;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#1D6FD6}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#FBFAF8;border:1px solid rgba(0,0,0,.09);border-radius:18px;
  box-shadow:0 18px 44px rgba(20,24,33,.10);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(0,0,0,.035);
  border-bottom:1px solid rgba(0,0,0,.09);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#6B7280;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.14);display:block}
.pill{background:#FFFFFF;border:1px solid rgba(0,0,0,.09);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#6B7280;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#2B303A}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#6B7280;background:rgba(0,0,0,.035);border:1px solid rgba(0,0,0,.09);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#1D6FD6;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:#E4F2E8;color:#1E7A3F;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:#FBE7D4;color:#AF560E}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#5C636E}
.accent{color:#1D6FD6}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.player{width:820px;margin:0 auto}
.screen{position:relative;background:#0A1222;height:206px;display:flex;align-items:center;
  justify-content:center}
.play{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center}
.toast{position:absolute;background:rgba(10,18,34,.92);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;color:#DCE7FB;
  display:flex;align-items:center;gap:9px}
.track{height:10px;border-radius:5px;background:rgba(255,255,255,.16);position:relative;
  margin:0 20px 16px}
.buf{position:absolute;left:0;top:0;bottom:0;width:78%;border-radius:5px;background:rgba(90,169,255,.55)}
.pos{position:absolute;left:0;top:0;bottom:0;width:31%;border-radius:5px;background:#2EE08A}
.knob{position:absolute;left:31%;top:50%;width:20px;height:20px;border-radius:50%;
  background:#2EE08A;transform:translate(-50%,-50%)}

</style></head><body><div class="page">
<div class="row" style="flex:0 0 auto"><img class="logo" src="../icons/icon128.png" width="63" height="63" style="flex:0 0 auto;"></div><div class="mid"><div class="win player"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="pill grow">a-movie-site.example/watch</span><span class="grow"></span></div><div class="screen"><div class="play"><svg width="25" height="28" viewBox="0 0 30 34"><path d="M3 2 L28 17 L3 32 Z" fill="#0A1222"/></svg></div><div class="toast" style="left:20px;top:18px"><span class="dot" style="color:#FF5C5C"></span>14 ads blocked</div><div class="toast" style="right:20px;top:18px"><span class="dot" style="color:#FF5C5C"></span>3 pop-up tabs closed</div><div class="toast" style="right:20px;bottom:18px"><span class="dot" style="color:#2EE08A"></span>2 min loaded ahead</div></div><div style="background:#0A1222;padding-top:14px"><div class="track"><span class="buf"></span><span class="pos"></span><span class="knob"></span></div></div></div></div><div class="tag" style=";margin-top:0px;flex:0 0 auto">Fewer ads. <span class="a">No pop-up tabs.</span> Less buffering.</div>
</div></body></html>
